      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      - in: path
        name: apiAccessPolicyId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
