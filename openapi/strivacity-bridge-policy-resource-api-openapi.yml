components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    IdReferenceRequest_ApplicationConfig:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    BridgePolicyResourceRequest.Authentication_ApplicationConfig:
      required:
      - authorizationScopes
      type: object
      properties:
        authorizationScopes:
          type: array
          items:
            $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        required:
          type: boolean
          default: true
    IdReferenceResponse_ApplicationConfig:
      type: object
      properties:
        id:
          type: string
          description: ID of the represented entity
    BridgePolicyResourceResponse.Authentication_ApplicationConfig:
      type: object
      properties:
        authorizationScopes:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/IdReferenceResponse_ApplicationConfig'
        required:
          type: boolean
    BridgePolicyResourceInsertRequest_ApplicationConfig:
      required:
      - authentication
      - methods
      - pathPattern
      type: object
      properties:
        authentication:
          $ref: '#/components/schemas/BridgePolicyResourceRequest.Authentication_ApplicationConfig'
        methods:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            pattern: ^(GET|HEAD|POST|PUT|DELETE|CONNECT|OPTIONS|TRACE|PATCH)$
            type: string
        pathPattern:
          maxLength: 1024
          minLength: 0
          type: string
    BridgePolicyResourceUpdateRequest_ApplicationConfig:
      required:
      - authentication
      - id
      - methods
      - pathPattern
      type: object
      properties:
        authentication:
          $ref: '#/components/schemas/BridgePolicyResourceRequest.Authentication_ApplicationConfig'
        id:
          type: string
        methods:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            pattern: ^(GET|HEAD|POST|PUT|DELETE|CONNECT|OPTIONS|TRACE|PATCH)$
            type: string
        pathPattern:
          maxLength: 1024
          minLength: 0
          type: string
    BridgePolicyResourceResponse_ApplicationConfig:
      type: object
      properties:
        authentication:
          $ref: '#/components/schemas/BridgePolicyResourceResponse.Authentication_ApplicationConfig'
        id:
          type: string
        methods:
          uniqueItems: true
          type: array
          items:
            type: string
        pathPattern:
          type: string
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
