components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    NotificationPreferencesResponse:
      type: object
      properties:
        accountAttributeUpdate:
          type: boolean
        accountDeletion:
          type: boolean
        accountLockout:
          type: boolean
        mfaMethodChange:
          type: boolean
        passwordResetSuccess:
          type: boolean
      description: Contains which types of notifications are enabled or not for an account
    AccountProofingWithNameAndDeletedResponse_Account:
      type: object
      properties:
        attempts:
          type: integer
          format: int64
        deleted:
          type: boolean
        id:
          type: string
          format: uuid
        invalidatedAt:
          type: string
          format: date-time
        policyId:
          type: string
        proofedAt:
          type: string
          format: date-time
    RoleAssignmentRequest_Account:
      required:
      - organization
      - roles
      type: object
      properties:
        organization:
          minLength: 1
          type: string
          description: ID of the represented organization
        roles:
          maxItems: 2147483647
          minItems: 1
          type: array
          description: Represents a list of role IDs
          items:
            $ref: '#/components/schemas/IdReferenceRequest_Account'
      description: Represents a role assignment for an account. By specifying an organization and a list of roles by their IDs, this defines organization-role pairs to be assigned to an account.
    AccountRole_Account:
      required:
      - id
      - organization
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: ID of the represented role
        organization:
          minLength: 1
          type: string
          description: ID of the represented organization
      description: Represents an organization-role assignment
    AccountOutboundProvisionStatusResponse:
      type: object
      properties:
        lastRunAt:
          type:
          - string
          - 'null'
          format: date-time
        message:
          $ref: '#/components/schemas/Message'
        nextRunAt:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
        target:
          type: string
        targetId:
          type: string
    IdentitiesResponse.External_Account:
      type: object
      properties:
        display:
          type: string
        id:
          type: string
          description: Represents an external identifier
        metadata:
          type: object
          additionalProperties:
            type: object
    IdReferenceRequest_Account:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    Hash_Account:
      required:
      - value
      type: object
      properties:
        value:
          type: string
    PasswordHash_Account:
      required:
      - hash
      - method
      type: object
      properties:
        hash:
          $ref: '#/components/schemas/Hash_Account'
        method:
          type: string
          description: The algorithm that was used to hash the password.
          enum:
          - SHA256Salted
          - SHA256
          - SHA1Salted
          - SHA1
          - MD5Salted
          - MD5
          - Argon2
          - BCrypt
          - AspDotNet
          - SSHA256SaltedBase64
        salt:
          $ref: '#/components/schemas/Salt_Account'
      description: Password hash object to be migrated directly from legacy store. This field and password are mutually exclusive.
    AccountIdentifierUpdateRequest_Account:
      required:
      - type
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
          description: Identifier method used by identity stores
          enum:
          - username
          - email
          - phone
    FeatureResponse_Account:
      type: object
      properties:
        geometry:
          $ref: '#/components/schemas/GeometryResponse_Account'
        properties:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
      description: Represents a feature object according to the [RFC 7946](https://www.rfc-editor.org/rfc/rfc7946#section-3.2) standard
    ImpersonationResponse_Account:
      type: object
      properties:
        impersonationUrl:
          type: string
    PasswordResetRequest_Account:
      type: object
      properties:
        newPassword:
          maxLength: 256
          minLength: 1
          type: string
        newPasswordHash:
          $ref: '#/components/schemas/PasswordHash_Account'
        skipPasswordPolicy:
          type: boolean
      description: Contains the new password for a password reset
    AccountOrganizationUpdateRequest:
      type: object
      properties:
        id:
          type: string
          description: ID of the represented organization. If not specified, the account will be non-organizational.
    AccountLockout_Account:
      type: object
      properties:
        failedPasscodeAttemptCount:
          type: integer
          format: int32
        failedPasscodeAttemptCountPermanentLock:
          type: integer
          format: int32
        failedPasswordAttemptCount:
          type: integer
          format: int32
        failedPasswordAttemptCountPermanentLock:
          type: integer
          format: int32
        locks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AccountLock_Account'
      description: Represents the account lockout details
    AccountLock_Account:
      type: object
      properties:
        until:
          type: string
          description: null in case of permanent lock, otherwise temporary lock
          format: date-time
      description: Represents a lock on the account
    AuthenticatorAdminInsertRequest_Account:
      required:
      - target
      - type
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: object
        publicMetadata:
          type: object
          additionalProperties:
            type: object
        subType:
          type: string
          description: ID of subtype
        target:
          minLength: 1
          type: string
          description: Targeted email address or phone number the MFA request is sent to
        type:
          type: string
          enum:
          - email
          - phone
          - custom
    NotificationPreferencesResponse_Account:
      type: object
      properties:
        accountAttributeUpdate:
          type: boolean
        accountDeletion:
          type: boolean
        accountLockout:
          type: boolean
