      description: 'You can lift password lock for an account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:account |'
      operationId: liftPasswordLock
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
