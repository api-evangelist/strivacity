openapi: 3.2.0
info:
  title: Admin Console Getting Started Authenticating to the API
  version: 1.0.0
servers:
- description: Generated server url
  url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
security:
- basicAuth: []
tags:
- name: Authenticating to the API
paths:
  /oauth2/token:
    post:
      summary: Exchange credentials for a token
      tags:
      - Authenticating to the API
      description: Exchange credentials for a token. Use your client_id as the username and client_secret as the password
      operationId: tokenpost
      requestBody:
        description: get a token
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - audience
              - scope
              properties:
                scope:
                  type: string
                  description: The scope or scopes required, separated by a space
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  description: OpenID grant type
                audience:
                  type: string
                  description: The Strivacity tenant URL e.g. https://foo.strivacity.com
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                access_token: accessToken
                expires_in: 3599
                scope: list of allowed scopes
                token_type: bearer
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-readme:
  explorer-enabled: true
  proxy-enabled: true
x-provenance:
  method: harvested
  publisher: Strivacity
  source: https://docs.strivacity.com/openapi/admin-console-getting-started.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
