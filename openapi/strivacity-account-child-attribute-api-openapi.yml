openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Account Child Attribute API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Account Child Attribute
paths:
  /admin/api/v1/identityStores/{identityStoreName}/attributes/{parentAttributeId}/attributes:
    get:
      description: 'You can list the existing child attributes for a complex attribute with this API.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_identity_store |'
      operationId: getAllAccountAttributes_1
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: parentAttributeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/CheckboxChildAccountAttribute'
                  - $ref: '#/components/schemas/DateChildAccountAttribute'
                  - $ref: '#/components/schemas/EmailChildAccountAttribute'
                  - $ref: '#/components/schemas/PhoneNumberChildAccountAttribute'
                  - $ref: '#/components/schemas/SelectChildAccountAttribute'
                  - $ref: '#/components/schemas/StringChildAccountAttribute'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_identity_store
      summary: List child attributes
      tags:
      - Account Child Attribute
    post:
      description: 'You can create a child attribute for a complex attribute by calling this endpoint. A maximum of 5 indexed attributes can be created for an identity store.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_identity_store |'
      operationId: createAccountAttribute_1
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: parentAttributeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CheckboxChildAccountAttribute'
              - $ref: '#/components/schemas/DateChildAccountAttribute'
              - $ref: '#/components/schemas/EmailChildAccountAttribute'
              - $ref: '#/components/schemas/PhoneNumberChildAccountAttribute'
              - $ref: '#/components/schemas/SelectChildAccountAttribute'
              - $ref: '#/components/schemas/StringChildAccountAttribute'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckboxChildAccountAttribute'
                - $ref: '#/components/schemas/DateChildAccountAttribute'
                - $ref: '#/components/schemas/EmailChildAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberChildAccountAttribute'
                - $ref: '#/components/schemas/SelectChildAccountAttribute'
                - $ref: '#/components/schemas/StringChildAccountAttribute'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_identity_store
      summary: Create a child attribute
      tags:
      - Account Child Attribute
    put:
      description: 'You can reorder child attributes for a complex attribute by calling this endpoint. Request body should contain the existing child attribute IDs in the desired order.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_identity_store |'
      operationId: reorderAccountAttributes_1
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: parentAttributeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IdReferenceRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_identity_store
      summary: Reorder attributes
      tags:
      - Account Child Attribute
  /admin/api/v1/identityStores/{identityStoreName}/attributes/{parentAttributeId}/attributes/{id}:
    get:
      description: 'You can get a child attribute for an complex attribute by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_identity_store |'
      operationId: getAccountAttribute
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: parentAttributeId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckboxChildAccountAttribute'
                - $ref: '#/components/schemas/DateChildAccountAttribute'
                - $ref: '#/components/schemas/EmailChildAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberChildAccountAttribute'
                - $ref: '#/components/schemas/SelectChildAccountAttribute'
                - $ref: '#/components/schemas/StringChildAccountAttribute'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_identity_store
      summary: Get an Attribute
      tags:
      - Account Child Attribute
    put:
      description: 'You can update a child attribute for a complex attribute by calling this endpoint. The attribute type, name, path and searchability cannot be altered.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_identity_store |'
      operationId: updateAccountAttribute
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: parentAttributeId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CheckboxChildAccountAttribute'
              - $ref: '#/components/schemas/DateChildAccountAttribute'
              - $ref: '#/components/schemas/EmailChildAccountAttribute'
              - $ref: '#/components/schemas/PhoneNumberChildAccountAttribute'
              - $ref: '#/components/schemas/SelectChildAccountAttribute'
              - $ref: '#/components/schemas/StringChildAccountAttribute'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckboxChildAccountAttribute'
                - $ref: '#/components/schemas/DateChildAccountAttribute'
                - $ref: '#/components/schemas/EmailChildAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberChildAccountAttribute'
                - $ref: '#/components/schemas/SelectChildAccountAttribute'
                - $ref: '#/components/schemas/StringChildAccountAttribute'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_identity_store
      summary: Update a child attribute
      tags:
      - Account Child Attribute
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    DateChildAccountAttribute:
      required:
      - displayName
      - id
      - indexing
      - name
      - renderType
      - type
      type: object
      description: Represents a date type attribute
      allOf:
      - $ref: '#/components/schemas/ChildAccountAttribute'
      - type: object
        properties:
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          enabled:
            type: boolean
            default: false
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          renderType:
            type: string
            description: Defines how a date input field should be rendered. When set to `native`, the date picker appears as the browser default, `fieldSet` is ensuring that the year, month and day fields are separate inputs.
            enum:
            - native
            - fieldSet
          required:
            type: boolean
            default: false
          validator:
            $ref: '#/components/schemas/DateValidator'
    ChildAccountAttribute:
      type: object
      properties:
        displayName:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        path:
          type: string
        required:
          type: boolean
        type:
          type: string
          enum:
          - STRING
          - CHECKBOX
          - SELECT
          - PHONE_NUMBER
          - EMAIL
          - DATE
          - PASSWORD
          - USERNAME_IDENTIFIER
          - EMAIL_IDENTIFIER
          - PHONE_IDENTIFIER
          - STRING_LIST
          - SELECT_LIST
          - PHONE_NUMBER_LIST
          - EMAIL_LIST
          - DATE_LIST
          - COMPLEX_LIST
        uniqueInTheList:
          type: boolean
      description: Represents a child account attribute
      discriminator:
        propertyName: type
    DateValidator:
      type: object
      properties:
        notAfter:
          type: string
          description: Default value is null
          format: date
        notAfterRelativeDays:
          type: integer
          description: Default value is null
          format: int32
        notBefore:
          type: string
          description: Default value is null
          format: date
        notBeforeRelativeDays:
          type: integer
          description: Default value is null
          format: int32
      description: Represents a date validator
    StringChildAccountAttribute:
      required:
      - displayName
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents a string type attribute
      allOf:
      - $ref: '#/components/schemas/ChildAccountAttribute'
      - type: object
        properties:
          autocomplete:
            maxLength: 64
            minLength: 0
            type: string
            description: Provides automated assistance in filling out form field values
          default:
            type: string
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          enabled:
            type: boolean
            default: false
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
          validator:
            $ref: '#/components/schemas/StringValidator'
    EmailChildAccountAttribute:
      required:
      - displayName
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents an email type attribute
      allOf:
      - $ref: '#/components/schemas/ChildAccountAttribute'
      - type: object
        properties:
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          enabled:
            type: boolean
            default: false
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
    PhoneNumberChildAccountAttribute:
      required:
      - displayName
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents a phone number type attribute
      allOf:
      - $ref: '#/components/schemas/ChildAccountAttribute'
      - type: object
        properties:
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          enabled:
            type: boolean
            default: false
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
    StringValidator:
      type: object
      properties:
        errorMessage:
          maxLength: 512
          minLength: 0
          type: string
        max:
          maximum: 10000
          minimum: 1
          type: integer
          format: int32
          default: 512
        min:
          maximum: 512
          minimum: 0
          type: integer
          format: int32
          default: 0
        regex:
          maxLength: 512
          minLength: 0
          type: string
      description: Represents a string validator
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    SelectChildAccountAttribute:
      required:
      - displayName
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents a select type attribute
      allOf:
      - $ref: '#/components/schemas/ChildAccountAttribute'
      - type: object
        properties:
          default:
            type: string
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          enabled:
            type: boolean
            default: false
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          renderType:
            type: string
            description: Defines how a select input field should be rendered. When set to `native`, the select appears as the browser default, when set `radio` the select appears as radio buttons.
            enum:
            - native
            - radio
            default: native
          required:
            type: boolean
            default: false
          values:
            type: array
            description: Defines the possible options to be selected on a select input field
            items:
              $ref: '#/components/schemas/SelectValue'
    SelectValue:
      required:
      - displayName
      - value
      type: object
      properties:
        displayName:
          maxLength: 64
          minLength: 1
          type: string
        value:
          maxLength: 64
          minLength: 1
          type: string
      description: Represents a select value
    IdReferenceRequest:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    CheckboxChildAccountAttribute:
      required:
      - displayName
      - id
      - name
      - type
      type: object
      description: Represents a checkbox type attribute
      allOf:
      - $ref: '#/components/schemas/ChildAccountAttribute'
      - type: object
        properties:
          default:
            type: boolean
            default: false
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          enabled:
            type: boolean
            default: false
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
