openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Restricted Password API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Restricted Password
paths:
  /admin/api/v1/passwordPolicies/{policyId}/restrictedPasswords:
    get:
      description: 'You can list the existing password word restrictions by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_password_policy |'
      operationId: list_2
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasswordRestrictionResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_password_policy
      summary: List password word restrictions
      tags:
      - Restricted Password
    post:
      description: 'You can create a password word restriction by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_password_policy |'
      operationId: create_3
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordRestrictionInsertRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRestrictionResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_password_policy
      summary: Create a password word restriction
      tags:
      - Restricted Password
  /admin/api/v1/passwordPolicies/{policyId}/restrictedPasswords/quota:
    get:
      description: 'Get total size in MB of all password restrictions.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_password_policy |'
      operationId: getTotalSize
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PasswordRestrictionQuotaResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_password_policy
      summary: Get total size in MB
      tags:
      - Restricted Password
  /admin/api/v1/passwordPolicies/{policyId}/restrictedPasswords/{id}:
    delete:
      description: 'You can delete a password word restriction by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_password_policy |'
      operationId: delete_2
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_password_policy
      summary: Delete a password word restriction
      tags:
      - Restricted Password
    get:
      description: 'You can get a password word restriction by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_password_policy |'
      operationId: get_2
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PasswordRestrictionResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_password_policy
      summary: Get a password word restriction
      tags:
      - Restricted Password
    put:
      description: 'You can update a password word restriction by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_password_policy |'
      operationId: update_2
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRestrictionUpdateRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PasswordRestrictionResponse'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_password_policy
      summary: Update a password word restriction
      tags:
      - Restricted Password
  /admin/api/v1/passwordPolicies/{policyId}/restrictedPasswords/{id}/export:
    get:
      description: 'You can export a password restriction by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_password_policy |'
      operationId: export_1
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/plain: {}
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="{filename}"
              style: simple
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_password_policy
      summary: Export a password restriction
      tags:
      - Restricted Password
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    PasswordRestrictionUpdateRequest:
      required:
      - id
      - name
      type: object
      properties:
        description:
          maxLength: 1024
          minLength: 0
          type: string
        id:
          type: string
        name:
          maxLength: 64
          minLength: 3
          pattern: ^[a-zA-Z0-9_\.\-]+$
          type: string
    PasswordRestrictionInsertRequest:
      required:
      - file
      - name
      type: object
      properties:
        description:
          maxLength: 1024
          minLength: 0
          type: string
        file:
          type: string
          format: binary
        name:
          maxLength: 64
          minLength: 3
          pattern: ^[a-zA-Z0-9_\.\-]+$
          type: string
    PasswordRestrictionQuotaResponse:
      type: object
      properties:
        maxSizeInBytes:
          type: integer
          format: int32
        totalSizeInBytes:
          type: integer
          format: int32
    PasswordRestrictionResponse:
      type: object
      properties:
        description:
          type: string
        fileSize:
          type: integer
          format: int32
        id:
          type: string
        name:
          type: string
        uploadedAt:
          type: string
          format: date-time
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
