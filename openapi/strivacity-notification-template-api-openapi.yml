components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    NotificationTemplateResponse_NotificationTemplateMetainfo:
      type: object
      properties:
        displayName:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        modified:
          type: boolean
        optional:
          type: boolean
        placeholders:
          type: array
          items:
            $ref: '#/components/schemas/Placeholder_NotificationTemplateMetainfo'
      description: Represents a notification template
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    Placeholder_NotificationTemplateMetainfo:
      type: object
      properties:
        placeholder:
          type: string
      description: Represents a placeholder
    NotificationTemplateDTO_NotificationTemplate:
      required:
      - id
      type: object
      properties:
        body:
          maxLength: 100000
          minLength: 1
          type: string
          description: HTML body of the template, if not specified it'll be reset to the default template
        enabled:
          type: boolean
          default: true
        id:
          maxLength: 255
          minLength: 0
          pattern: ^[a-zA-Z0-9-_]+$
          type: string
        type:
          type: string
          enum:
          - sms
          - email
    NotificationTemplateSMSUpdateRequest_NotificationTemplate:
      required:
      - id
      type: object
      properties:
        body:
          maxLength: 100000
          minLength: 1
          type: string
          description: HTML body of the template, if not specified it'll be reset to the default template
        enabled:
          type: boolean
          default: true
        id:
          maxLength: 255
          minLength: 0
          pattern: ^[a-zA-Z0-9-_]+$
          type: string
        type:
          type: string
          enum:
          - sms
          - email
    NotificationTemplateEmailUpdateRequest_NotificationTemplate:
      required:
      - id
      type: object
      properties:
        body:
          maxLength: 100000
          minLength: 1
          type: string
          description: HTML body of the template, if not specified it'll be reset to the default template
        enabled:
          type: boolean
          default: true
        id:
          maxLength: 255
          minLength: 0
          pattern: ^[a-zA-Z0-9-_]+$
          type: string
        plainTextBody:
          maxLength: 100000
          minLength: 1
          type: string
          description: Plain text body of the template, if not specified it'll be reset to the default template
        subject:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
          description: Subject text of the template, if not specified it'll be reset to the default template
        type:
          type: string
          enum:
          - sms
          - email
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
