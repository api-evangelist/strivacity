openapi: 3.2.0
info:
  title: Strivacity Notification Policy API
  version: v0.0.1
  description: 'Operations tagged Notification Policy across 2 of this provider''s published API definitions: strivacity-admin-management-openapi-original.json, strivacity-admin-portal-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Notification Policy
paths:
  /admin/api/v1/admin/notificationPolicy:
    get:
      description: 'You can get admin notification policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_admin_notification_policy |'
      operationId: getAdminNotificationPolicy
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminNotificationPolicyResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_admin_notification_policy
      summary: Get admin notification policy
      tags:
      - Notification Policy
    put:
      description: 'You can update admin notification policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_admin_notification_policy |'
      operationId: updateAdminNotificationPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNotificationPolicyUpdateRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminNotificationPolicyResponse'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - write:config_admin_notification_policy
      summary: Update admin notification policy
      tags:
      - Notification Policy
    servers:
    - url: https://{tenant}
      variables:
        tenant:
          default: example.strivacity.com
          description: Your Strivacity tenant
  /admin/api/v1/notificationPolicies:
    get:
      description: 'You can list the existing notification policies by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_notification_policy |'
      operationId: getNotificationPolicies
      parameters:
      - description: Tags used for filtering must exactly match the tag name
        in: query
        name: policyTags
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      - description: Name used for filtering
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        schema:
          type: integer
          format: int64
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        schema:
          type: integer
          format: int64
          default: 20
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PagedModelNotificationPolicyResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_notification_policy
      summary: List notification policies
      tags:
      - Notification Policy
    post:
      description: 'You can create a notification policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_notification_policy |'
      operationId: createNotificationPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPolicy_InsertRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NotificationPolicyResponse_NotificationPolicy'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_notification_policy
      summary: Create a notification policy
      tags:
      - Notification Policy
    servers:
    - url: https://{tenant}
      variables:
        tenant:
          default: example.strivacity.com
          description: Your Strivacity tenant
  /admin/api/v1/notificationPolicies/{id}:
    delete:
      description: 'You can delete a notification policy by calling this endpoint. Notification policies assigned to applications or organization assignments cannot be deleted.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | delete:config_notification_policy |'
      operationId: deleteNotificationPolicy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Notification policy that is assigned to applications or organization assignments cannot be deleted
      security:
      - securityScheme:
        - delete:config_notification_policy
      summary: Delete a notification policy
      tags:
      - Notification Policy
    get:
      description: 'You can get a notification policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_notification_policy |'
      operationId: getNotificationPolicy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NotificationPolicyResponse_NotificationPolicy'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_notification_policy
      summary: Get a notification policy
      tags:
      - Notification Policy
    put:
      description: 'You can update a notification policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_notification_policy |'
      operationId: updateNotificationPolicy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPolicyUpsertRequest_NotificationPolicy'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NotificationPolicyResponse_NotificationPolicy'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_notification_policy
      summary: Update a notification policy
      tags:
      - Notification Policy
    servers:
    - url: https://{tenant}
      variables:
        tenant:
          default: example.strivacity.com
          description: Your Strivacity tenant
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    AdminNotificationPolicyUpdateRequest:
      required:
      - sender
      type: object
      properties:
        sender:
          maxLength: 64
          minLength: 0
          pattern: "([a-z0-9!#$%&'*+/=?^_`{|}~\x80-\uFFFF-]+|\"([a-z0-9!#$%&'*.(),<>\\[\\]:; @+/=?^_`{|}~\x80-\uFFFF-]|\\\\\\\\|\\\\\")+\")(\\.([a-z0-9!#$%&'*+/=?^_`{|}~\x80-\uFFFF-]+|\"([a-z0-9!#$%&'*.(),<>\\[\\]:; @+/=?^_`{|}~\x80-\uFFFF-]|\\\\\\\\|\\\\\")+\"))*"
          type: string
        senderDisplayName:
          maxLength: 255
          minLength: 1
          type: string
    AdminNotificationPolicyResponse:
      type: object
      properties:
        sender:
          type: string
        senderDisplayName:
          type: string
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    PageMetadata:
      type: object
      properties:
        number:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    NotificationPolicy_InsertRequest:
      required:
      - name
      - sender
      type: object
      properties:
        description:
          maxLength: 1024
          minLength: 0
          type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        policyTag:
          pattern: ^[a-z0-9_]{2,32}$
          type: string
          description: Must be an existing policy tag name
        sender:
          maxLength: 64
          minLength: 0
          pattern: "([a-z0-9!#$%&'*+/=?^_`{|}~\x80-\uFFFF-]+|\"([a-z0-9!#$%&'*.(),<>\\[\\]:; @+/=?^_`{|}~\x80-\uFFFF-]|\\\\\\\\|\\\\\")+\")(\\.([a-z0-9!#$%&'*+/=?^_`{|}~\x80-\uFFFF-]+|\"([a-z0-9!#$%&'*.(),<>\\[\\]:; @+/=?^_`{|}~\x80-\uFFFF-]|\\\\\\\\|\\\\\")+\"))*"
          type: string
        senderDisplayName:
          maxLength: 255
          minLength: 1
          type: string
    NotificationPolicyResponse_NotificationPolicy:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        policyTag:
          type: string
        sender:
          type: string
        senderDisplayName:
          type: string
    NotificationPolicyUpsertRequest_NotificationPolicy:
      required:
      - id
      - name
      - sender
      type: object
      properties:
        description:
          maxLength: 1024
          minLength: 0
          type: string
        id:
          type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        policyTag:
          pattern: ^[a-z0-9_]{2,32}$
          type: string
          description: Must be an existing policy tag name
        sender:
          maxLength: 64
          minLength: 0
          pattern: "([a-z0-9!#$%&'*+/=?^_`{|}~\x80-\uFFFF-]+|\"([a-z0-9!#$%&'*.(),<>\\[\\]:; @+/=?^_`{|}~\x80-\uFFFF-]|\\\\\\\\|\\\\\")+\")(\\.([a-z0-9!#$%&'*+/=?^_`{|}~\x80-\uFFFF-]+|\"([a-z0-9!#$%&'*.(),<>\\[\\]:; @+/=?^_`{|}~\x80-\uFFFF-]|\\\\\\\\|\\\\\")+\"))*"
          type: string
        senderDisplayName:
          maxLength: 255
          minLength: 1
          type: string
    NotificationPolicyResponse:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        policyTag:
          type: string
        sender:
          type: string
        senderDisplayName:
          type: string
    PagedModelNotificationPolicyResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPolicyResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
x-refined-from:
- strivacity-admin-management-openapi-original.json
- strivacity-admin-portal-openapi-original.json
x-readme:
  explorer-enabled: true
  proxy-enabled: true
