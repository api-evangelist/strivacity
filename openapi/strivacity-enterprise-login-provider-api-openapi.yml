          pattern: ^((?![<>]).)*$
          type: string
        name:
          maxLength: 64
          minLength: 2
          pattern: '[a-zA-Z0-9]+'
          type: string
          description: This field cannot be altered
        onlyStoreMappedValues:
          type: boolean
          default: false
        policyTag:
          pattern: ^[a-z0-9_]{2,32}$
          type: string
          description: Must be an existing policy tag name
        type:
          type: string
          description: This field cannot be altered
          enum:
          - oidc
          - okta
          - azure
          - hypr
          - saml2
          - github
          - microsoft
          - google
          - facebook
          - twitter
          - linkedin
          - amazon
          - apple
        updateAccountInfoOnLogin:
          type: boolean
          default: false
    LanguageOverrideResponse:
      type: object
      properties:
        enabled:
          type: boolean
        regex:
          type: string
        sourcePath:
          type: string
    AdditionalAuthRequestParamResponse:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    OidcSpecializedLoginProviderResponse:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/OidcSpecializedConfiguration'
        description:
          type: string
        id:
          type: string
        languageOverride:
          $ref: '#/components/schemas/LanguageOverrideResponse'
        loginButtonText:
          type: string
        name:
          type: string
        onlyStoreMappedValues:
          type: boolean
        policyTag:
          type: string
        type:
          type: string
          enum:
          - oidc
          - okta
          - azure
          - hypr
          - saml2
          - github
          - microsoft
          - google
          - facebook
          - twitter
          - linkedin
          - amazon
          - apple
        updateAccountInfoOnLogin:
          type: boolean
    OidcLoginProviderRequestConfiguration:
      required:
      - claims
      - clientId
      - clientSecret
      type: object
      properties:
        PARConfigurationRequest:
          $ref: '#/components/schemas/PARConfigurationRequest'
        acrValue:
          maxLength: 8192
          minLength: 1
          type: string
        additionalAuthRequestParams:
          maxItems: 8
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/AdditionalAuthRequestParamUpsertRequest'
        authorizationEndpoint:
          maxLength: 1024
          minLength: 1
          type: string
        claims:
          type: array
          items:
            minLength: 1
            type: string
        clientId:
          maxLength: 128
          minLength: 1
          type: string
        clientSecret:
          maxLength: 1024
          minLength: 1
          type: string
        issuer:
          maxLength: 1024
          minLength: 1
          type: string
        jwksUri:
          maxLength: 1024
          minLength: 1
          type: string
        messageLevelEncryption:
          $ref: '#/components/schemas/MessageLevelEncryptionRequest'
        openIdAutoDiscoveryURL:
          maxLength: 1024
          minLength: 1
          type: string
        tokenEndpoint:
          maxLength: 1024
          minLength: 1
          type: string
        tokenEndpointAuthMethodOverride:
          type: string
          description: 'Sets or overrides token endpoint authentication method of Auto-discovery config.

            Options:

            (1) null - use settings from auto-discovery, fallback to Basic if no auto-discovery

            (2) client_secret_basic - client ID and secret sent in authorization header

            (3) client_secret_post - client ID and secret sent in body of request

            '
