openapi: 3.2.0
info:
  description: API documentation of Admin Portal - Admin Management
  title: Admin Portal - Admin Management Custom Adaptive MFA API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Custom Adaptive MFA
paths:
  /admin/api/v1/admin/customMfas:
    get:
      description: 'You can list the existing custom mfas by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_custom_mfa |

        | read:config_admin_adaptive_mfa |

        | read:config_adaptive_mfa |'
      operationId: list_2
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomMfaListResponse_CustomMfa'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_custom_mfa
        - read:config_admin_adaptive_mfa
        - read:config_adaptive_mfa
      summary: List custom mfas
      tags:
      - Custom Adaptive MFA
    post:
      description: 'You can create a custom mfa by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_custom_mfa |'
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomMfaInsertRequest_CustomMfa'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomMfaResponse_CustomMfa'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_custom_mfa
      summary: Create a custom mfa policy
      tags:
      - Custom Adaptive MFA
  /admin/api/v1/admin/customMfas/{id}:
    delete:
      description: 'You can delete a custom mfa by calling this endpoint. Custom mfa assigned to MFA policy assignments cannot be deleted.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | delete:config_custom_mfa |'
      operationId: deleteAdaptiveMFAById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Custom mfa is assigned to an application or organization assignment
      security:
      - securityScheme:
        - delete:config_custom_mfa
      summary: Delete a custom mfa
      tags:
      - Custom Adaptive MFA
    get:
      description: 'You can get a custom mfa by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_custom_mfa |'
      operationId: getCustomMfa
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomMfaResponse_CustomMfa'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_custom_mfa
      summary: Get a custom mfa
      tags:
      - Custom Adaptive MFA
    put:
      description: 'You can update a custom mfa by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_custom_mfa |'
      operationId: updateCustomMFA
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomMfaUpdateRequest_CustomMfa'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomMfaResponse_CustomMfa'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_custom_mfa
      summary: Update a custom mfa
      tags:
      - Custom Adaptive MFA
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    CustomMfaResponse_CustomMfa:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        iconUrl:
          type: string
        id:
          type: string
        methods:
          type: array
          items:
            type: string
        name:
          type: string
        packageDependencies:
          type: object
          additionalProperties:
            type: string
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    CustomMfaInsertRequest_CustomMfa:
      required:
      - methods
      - name
      - packageDependencies
      type: object
      properties:
        code:
          maxLength: 256000
          minLength: 1
          type: string
          description: Code of the custom mfa, if not specified it's generated automatically for each type
          default: '*example code*'
        description:
          type: string
        iconUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
        methods:
          maxItems: 1
          minItems: 1
          type: array
          items:
            pattern: ^(passcode|magicLink)$
            type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        packageDependencies:
          type: object
          additionalProperties:
            type: string
            description: Dependencies used for the event hook function
          description: Dependencies used for the event hook function
    CustomMfaListResponse_CustomMfa:
      type: object
      properties:
        description:
          type: string
        iconUrl:
          type: string
        id:
          type: string
        methods:
          type: array
          items:
            type: string
        name:
          type: string
    CustomMfaUpdateRequest_CustomMfa:
      required:
      - id
      - methods
      - name
      - packageDependencies
      type: object
      properties:
        code:
          maxLength: 256000
          minLength: 1
          type: string
          description: Code of the custom mfa, if not specified it's generated automatically for each type
          default: '*example code*'
        description:
          type: string
        iconUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
        id:
          type: string
        methods:
          maxItems: 1
          minItems: 1
          type: array
          items:
            pattern: ^(passcode|magicLink)$
            type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        packageDependencies:
          type: object
          additionalProperties:
            type: string
            description: Dependencies used for the event hook function
          description: Dependencies used for the event hook function
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
