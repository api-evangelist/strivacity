openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Account Attribute API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Account Attribute
paths:
  /admin/api/v1/identityStores/{identityStoreName}/attributes:
    get:
      description: 'You can list the existing attributes for an identity store with this API.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_identity_store |'
      operationId: getAllAccountAttributes
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/CheckboxAccountAttribute'
                  - $ref: '#/components/schemas/ComplexListAccountAttribute'
                  - $ref: '#/components/schemas/DateAccountAttribute'
                  - $ref: '#/components/schemas/DateListAccountAttribute'
                  - $ref: '#/components/schemas/EmailAccountAttribute'
                  - $ref: '#/components/schemas/EmailListAccountAttribute'
                  - $ref: '#/components/schemas/IdentifierAccountAttribute'
                  - $ref: '#/components/schemas/PasswordAccountAttribute'
                  - $ref: '#/components/schemas/PhoneNumberAccountAttribute'
                  - $ref: '#/components/schemas/PhoneNumberListAccountAttribute'
                  - $ref: '#/components/schemas/SelectAccountAttribute'
                  - $ref: '#/components/schemas/SelectListAccountAttribute'
                  - $ref: '#/components/schemas/StringAccountAttribute'
                  - $ref: '#/components/schemas/StringListAccountAttribute'
                  - $ref: '#/components/schemas/UsernameIdentifierAttributeDTO'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_identity_store
      summary: List attributes
      tags:
      - Account Attribute
    post:
      description: 'You can create an attribute for an identity store by calling this endpoint. A maximum of 5 indexed attributes can be created for an identity store.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_identity_store |'
      operationId: createAccountAttribute
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/Checkbox_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Complex_List_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Date_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Date_List_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Email_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Email_List_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/PhoneNumber_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/PhoneNumber_List_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Select_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/Select_List_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/String_AccountAttribute_InsertRequest'
              - $ref: '#/components/schemas/String_List_AccountAttribute_InsertRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckboxAccountAttribute'
                - $ref: '#/components/schemas/ComplexListAccountAttribute'
                - $ref: '#/components/schemas/DateAccountAttribute'
                - $ref: '#/components/schemas/DateListAccountAttribute'
                - $ref: '#/components/schemas/EmailAccountAttribute'
                - $ref: '#/components/schemas/EmailListAccountAttribute'
                - $ref: '#/components/schemas/IdentifierAccountAttribute'
                - $ref: '#/components/schemas/PasswordAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberListAccountAttribute'
                - $ref: '#/components/schemas/SelectAccountAttribute'
                - $ref: '#/components/schemas/SelectListAccountAttribute'
                - $ref: '#/components/schemas/StringAccountAttribute'
                - $ref: '#/components/schemas/StringListAccountAttribute'
                - $ref: '#/components/schemas/UsernameIdentifierAttributeDTO'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_identity_store
      summary: Create an attribute
      tags:
      - Account Attribute
    put:
      description: 'You can reorder attributes for an identity store by calling this endpoint. Request body should contain the existing attribute IDs in the desired order.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_identity_store |'
      operationId: reorderAccountAttributes
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IdReferenceRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_identity_store
      summary: Reorder attributes
      tags:
      - Account Attribute
  /admin/api/v1/identityStores/{identityStoreName}/attributes/{id}:
    get:
      description: 'You can get an attribute for an identity store by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_identity_store |'
      operationId: getAccountAttribute_1
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckboxAccountAttribute'
                - $ref: '#/components/schemas/ComplexListAccountAttribute'
                - $ref: '#/components/schemas/DateAccountAttribute'
                - $ref: '#/components/schemas/DateListAccountAttribute'
                - $ref: '#/components/schemas/EmailAccountAttribute'
                - $ref: '#/components/schemas/EmailListAccountAttribute'
                - $ref: '#/components/schemas/IdentifierAccountAttribute'
                - $ref: '#/components/schemas/PasswordAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberListAccountAttribute'
                - $ref: '#/components/schemas/SelectAccountAttribute'
                - $ref: '#/components/schemas/SelectListAccountAttribute'
                - $ref: '#/components/schemas/StringAccountAttribute'
                - $ref: '#/components/schemas/StringListAccountAttribute'
                - $ref: '#/components/schemas/UsernameIdentifierAttributeDTO'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_identity_store
      summary: Get an Attribute
      tags:
      - Account Attribute
    put:
      description: 'You can update an attribute for an identity store by calling this endpoint. The attribute type, name, path and searchability cannot be altered.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_identity_store |'
      operationId: updateAccountAttribute_1
      parameters:
      - in: path
        name: identityStoreName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CheckboxAccountAttribute'
              - $ref: '#/components/schemas/ComplexListAccountAttribute'
              - $ref: '#/components/schemas/DateAccountAttribute'
              - $ref: '#/components/schemas/DateListAccountAttribute'
              - $ref: '#/components/schemas/EmailAccountAttribute'
              - $ref: '#/components/schemas/EmailListAccountAttribute'
              - $ref: '#/components/schemas/IdentifierAccountAttribute'
              - $ref: '#/components/schemas/PasswordAccountAttribute'
              - $ref: '#/components/schemas/PhoneNumberAccountAttribute'
              - $ref: '#/components/schemas/PhoneNumberListAccountAttribute'
              - $ref: '#/components/schemas/SelectAccountAttribute'
              - $ref: '#/components/schemas/SelectListAccountAttribute'
              - $ref: '#/components/schemas/StringAccountAttribute'
              - $ref: '#/components/schemas/StringListAccountAttribute'
              - $ref: '#/components/schemas/UsernameIdentifierAttributeDTO'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: '#/components/schemas/CheckboxAccountAttribute'
                - $ref: '#/components/schemas/ComplexListAccountAttribute'
                - $ref: '#/components/schemas/DateAccountAttribute'
                - $ref: '#/components/schemas/DateListAccountAttribute'
                - $ref: '#/components/schemas/EmailAccountAttribute'
                - $ref: '#/components/schemas/EmailListAccountAttribute'
                - $ref: '#/components/schemas/IdentifierAccountAttribute'
                - $ref: '#/components/schemas/PasswordAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberAccountAttribute'
                - $ref: '#/components/schemas/PhoneNumberListAccountAttribute'
                - $ref: '#/components/schemas/SelectAccountAttribute'
                - $ref: '#/components/schemas/SelectListAccountAttribute'
                - $ref: '#/components/schemas/StringAccountAttribute'
                - $ref: '#/components/schemas/StringListAccountAttribute'
                - $ref: '#/components/schemas/UsernameIdentifierAttributeDTO'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_identity_store
      summary: Update an attribute
      tags:
      - Account Attribute
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    AccountAttributeConnector:
      type: object
      properties:
        readFromPath:
          maxLength: 256
          minLength: 1
          type: string
      description: Represents the connector related configurations
    StringValidator:
      type: object
      properties:
        errorMessage:
          maxLength: 512
          minLength: 0
          type: string
        max:
          maximum: 10000
          minimum: 1
          type: integer
          format: int32
          default: 512
        min:
          maximum: 512
          minimum: 0
          type: integer
          format: int32
          default: 0
        regex:
          maxLength: 512
          minLength: 0
          type: string
      description: Represents a string validator
    Date_List_AccountAttribute_InsertRequest:
      required:
      - displayName
      - id
      - indexing
      - name
      - renderType
      - type
      type: object
      description: Represents a date list attribute
      allOf:
      - required:
        - displayName
        - frontendHook
        - name
        - type
        type: object
        properties:
          connector:
            $ref: '#/components/schemas/AccountAttributeConnector'
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          displayOnAdminConsole:
            type: boolean
            default: false
          displayOnMyAccount:
            type: boolean
            default: false
          displayOnOrganizationPortal:
            type: boolean
            default: false
          displayOnRegistration:
            type: boolean
            default: false
          editableOnAdminConsole:
            type: boolean
            default: false
          editableOnMyAccount:
            type: boolean
            default: false
          editableOnOrganizationPortal:
            type: boolean
            default: false
          enabled:
            type: boolean
            default: false
          frontendHook:
            $ref: '#/components/schemas/FrontendHook'
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          nativeClaim:
            $ref: '#/components/schemas/NativeClaim'
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
          type:
            type: string
            enum:
            - STRING
            - CHECKBOX
            - SELECT
            - PHONE_NUMBER
            - EMAIL
            - DATE
            - PASSWORD
            - USERNAME_IDENTIFIER
            - EMAIL_IDENTIFIER
            - PHONE_IDENTIFIER
            - STRING_LIST
            - SELECT_LIST
            - PHONE_NUMBER_LIST
            - EMAIL_LIST
            - DATE_LIST
            - COMPLEX_LIST
        description: Represents an account attribute
        discriminator:
          propertyName: type
      - type: object
        properties:
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          listValidator:
            $ref: '#/components/schemas/ListValidator'
          renderType:
            type: string
            description: Defines how a date input field should be rendered. When set to `native`, the date picker appears as the browser default, `fieldSet` is ensuring that the year, month and day fields are separate inputs.
            enum:
            - native
            - fieldSet
          validator:
            $ref: '#/components/schemas/DateValidator'
    DateListAccountAttribute:
      required:
      - displayName
      - id
      - indexing
      - name
      - renderType
      - type
      type: object
      description: Represents a date list attribute
      allOf:
      - $ref: '#/components/schemas/AccountAttribute'
      - type: object
        properties:
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          listValidator:
            $ref: '#/components/schemas/ListValidator'
          renderType:
            type: string
            description: Defines how a date input field should be rendered. When set to `native`, the date picker appears as the browser default, `fieldSet` is ensuring that the year, month and day fields are separate inputs.
            enum:
            - native
            - fieldSet
          validator:
            $ref: '#/components/schemas/DateValidator'
    NativeClaim:
      required:
      - displayName
      - id
      - name
      type: object
      properties:
        description:
          maxLength: 1024
          minLength: 0
          type: string
        dialectUri:
          type: string
          default: http://strivacity.com/claims
        displayName:
          maxLength: 64
          minLength: 3
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        id:
          type: string
        name:
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9_!#$&'()*+,\/:;=?@\[\].]*$
          type: string
        readonly:
          type: boolean
          readOnly: true
    IdReferenceRequest:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    PhoneNumber_AccountAttribute_InsertRequest:
      required:
      - displayName
      - frontendHook
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents a phone number type attribute
      allOf:
      - required:
        - displayName
        - frontendHook
        - name
        - type
        type: object
        properties:
          connector:
            $ref: '#/components/schemas/AccountAttributeConnector'
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          displayOnAdminConsole:
            type: boolean
            default: false
          displayOnMyAccount:
            type: boolean
            default: false
          displayOnOrganizationPortal:
            type: boolean
            default: false
          displayOnRegistration:
            type: boolean
            default: false
          editableOnAdminConsole:
            type: boolean
            default: false
          editableOnMyAccount:
            type: boolean
            default: false
          editableOnOrganizationPortal:
            type: boolean
            default: false
          enabled:
            type: boolean
            default: false
          frontendHook:
            $ref: '#/components/schemas/FrontendHook'
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          nativeClaim:
            $ref: '#/components/schemas/NativeClaim'
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
          type:
            type: string
            enum:
            - STRING
            - CHECKBOX
            - SELECT
            - PHONE_NUMBER
            - EMAIL
            - DATE
            - PASSWORD
            - USERNAME_IDENTIFIER
            - EMAIL_IDENTIFIER
            - PHONE_IDENTIFIER
            - STRING_LIST
            - SELECT_LIST
            - PHONE_NUMBER_LIST
            - EMAIL_LIST
            - DATE_LIST
            - COMPLEX_LIST
        description: Represents an account attribute
        discriminator:
          propertyName: type
      - type: object
        properties:
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
    Select_AccountAttribute_InsertRequest:
      required:
      - displayName
      - frontendHook
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents a select type attribute
      allOf:
      - required:
        - displayName
        - frontendHook
        - name
        - type
        type: object
        properties:
          connector:
            $ref: '#/components/schemas/AccountAttributeConnector'
          displayName:
            maxLength: 128
            minLength: 1
            pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
            type: string
          displayOnAdminConsole:
            type: boolean
            default: false
          displayOnMyAccount:
            type: boolean
            default: false
          displayOnOrganizationPortal:
            type: boolean
            default: false
          displayOnRegistration:
            type: boolean
            default: false
          editableOnAdminConsole:
            type: boolean
            default: false
          editableOnMyAccount:
            type: boolean
            default: false
          editableOnOrganizationPortal:
            type: boolean
            default: false
          enabled:
            type: boolean
            default: false
          frontendHook:
            $ref: '#/components/schemas/FrontendHook'
          name:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
            type: string
          nativeClaim:
            $ref: '#/components/schemas/NativeClaim'
          path:
            maxLength: 128
            minLength: 0
            pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
            type: string
            description: Default value is an empty string
          required:
            type: boolean
            default: false
          type:
            type: string
            enum:
            - STRING
            - CHECKBOX
            - SELECT
            - PHONE_NUMBER
            - EMAIL
            - DATE
            - PASSWORD
            - USERNAME_IDENTIFIER
            - EMAIL_IDENTIFIER
            - PHONE_IDENTIFIER
            - STRING_LIST
            - SELECT_LIST
            - PHONE_NUMBER_LIST
            - EMAIL_LIST
            - DATE_LIST
            - COMPLEX_LIST
        description: Represents an account attribute
        discriminator:
          propertyName: type
      - type: object
        properties:
          default:
            type: string
          indexing:
            type: string
            description: 'Defines searchability for an attribute. Possible values: `none` - Not searchable, `searchOnly` - Searchable, `searchUnique` - Searchable and unique to identity store, `searchUniqueInOrganization` - Searchable and unique to organization'
            enum:
            - none
            - searchOnly
            - searchUnique
            - searchUniqueInOrganization
          renderType:
            type: string
            description: Defines how a select input field should be rendered. When set to `native`, the select appears as the browser default, when set `radio` the select appears as radio buttons.
            enum:
            - native
            - radio
            default: native
          values:
            type: array
            description: Defines the possible options to be selected on a select input field
            items:
              $ref: '#/components/schemas/SelectValue'
    PasswordAccountAttribute:
      required:
      - displayName
      - id
      - type
      type: object
      description: Represents an password type attribute
      allOf:
      - $ref: '#/components/schemas/AccountAttribute'
    String_AccountAttribute_InsertRequest:
      required:
      - displayName
      - frontendHook
      - id
      - indexing
      - name
      - type
      type: object
      description: Represents a string type attribute
      allOf:
      - required:
        - displayName
        - frontendHook
        - name
        - type
        type: object
        properties:
          connector:
            $ref: '#/components/schemas/AccountAttributeConnector'
          displayName:
