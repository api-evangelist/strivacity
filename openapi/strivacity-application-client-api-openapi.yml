openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Application Client API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Application Client
paths:
  /admin/api/v2/applications/{applicationId}/clients:
    get:
      description: 'You can list the existing application clients by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: getAllClients
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenericClientResponse_ApplicationConfig'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_application
      summary: List application clients
      tags:
      - Application Client
    post:
      description: 'You can create an application client by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_application |'
      operationId: createClient
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericClient_InsertRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModifiableClientResponse_ApplicationConfig'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Referenced application does not exist
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_application
      summary: Create an application client
      tags:
      - Application Client
  /admin/api/v2/applications/{applicationId}/clients/{clientId}:
    delete:
      description: 'You can delete an application client by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_application |'
      operationId: deleteApplicationClient
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: SSP client is not removable
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Referenced application does not exist
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Oauth2 client has API security policy assigned to it
      security:
      - securityScheme:
        - write:config_application
      summary: Delete an application client
      tags:
      - Application Client
    get:
      description: 'You can get an application client by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: getClient
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GenericClientResponse_ApplicationConfig'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Referenced application client does not exist
      security:
      - securityScheme:
        - read:config_application
      summary: Get an application client
      tags:
      - Application Client
    put:
      description: 'You can update an application client by calling this endpoint. The `name` and `loginUrl` fields for SSP clients cannot be altered.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_application |'
      operationId: updateClient
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericClientUpdateRequest_ApplicationConfig'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GenericClientResponse_ApplicationConfig'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Referenced application does not exist
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_application
      summary: Update an application client
      tags:
      - Application Client
  /admin/api/v2/applications/{applicationId}/clients/{clientId}/logs:
    get:
      description: 'You can list the token exchange claim mapping function logs by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: getTokenExchangeClaimMappingLogs
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      - in: query
        name: accountIds
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: accountEventIds
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: logLevels
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Start date used for filtering
        in: query
        name: startDate
        required: false
        schema:
          type: string
          format: date-time
      - description: End date used for filtering
        in: query
        name: endDate
        required: false
        schema:
          type: string
          format: date-time
      - description: Zero-based page index (0..N)
        in: query
        name: page
        schema:
          type: integer
          format: int64
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        schema:
          type: integer
          format: int64
          default: 20
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaseEventHookLogListResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_application
      summary: List token exchange claim mapping function logs
      tags:
      - Application Client
  /admin/api/v2/applications/{applicationId}/clients/{clientId}/logs/{id}:
    get:
      description: 'You can get the token exchange claim mapping function log by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: getTokenExchangeEventHookLogById
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InternalEventHookLogResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_application
      summary: Get the token exchange claim mapping function log
      tags:
      - Application Client
  /admin/api/v2/applications/{applicationId}/clients/{clientId}/saml2/metadata/descriptor:
    get:
      description: 'You can get the SAML2 metadata for an application client by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: getSaml2MetadataDescriptor
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Saml2MetadataDescriptorResponse_ApplicationConfig'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Referenced application does not exist
      security:
      - securityScheme:
        - read:config_application
      summary: Get SAML2 metadata for an application client
      tags:
      - Application Client
  /admin/api/v2/applications/{applicationId}/clients/{clientId}/status:
    get:
      description: 'You an get the status of the token exchange claim mapping function by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: getTokenExchangeStatus
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventHookStatusResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_application
      summary: Get status of the token exchange claim mapping function
      tags:
      - Application Client
components:
  schemas:
    EventHookStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - UPGRADING
          - UNHEALTHY
          - NOT_RUNNING
          - NON_DEPLOYED
    GenericClientResponse_ApplicationConfig:
      type: object
      oneOf:
      - $ref: '#/components/schemas/SspClientResponse_ApplicationConfig'
      - $ref: '#/components/schemas/OrgPortalClientResponse_ApplicationConfig'
      - $ref: '#/components/schemas/OAuth2ClientResponse_ApplicationConfig'
      - $ref: '#/components/schemas/Saml2ClientResponse_ApplicationConfig'
      - $ref: '#/components/schemas/BridgeClientResponse_ApplicationConfig'
      - $ref: '#/components/schemas/OAuth2NativeClientResponse_ApplicationConfig'
      - $ref: '#/components/schemas/TokenExchangeClientResponse_ApplicationConfig'
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    ActorTokenResponse_ApplicationConfig:
      type: object
      properties:
        issuer:
          type: string
        jwksUri:
          type: string
        tokenType:
          type: string
    AssetLinkTargetUpdate_ApplicationConfig:
      required:
      - packageName
      - sha256CertFingerprint
      type: object
      properties:
        packageName:
          maxLength: 256
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
        sha256CertFingerprint:
          pattern: ^([A-Z0-9]{2}:){31}[A-Z0-9]{2}$
          type: string
    OAuth2NativeClientResponse_ApplicationConfig:
      type: object
      properties:
        applicationDomain:
          type: string
        applicationLauncherEntry:
          $ref: '#/components/schemas/ApplicationLauncherEntryResponse_ApplicationConfig'
        baseOrganization:
          $ref: '#/components/schemas/IdReferenceResponse_ApplicationConfig'
        configuration:
          $ref: '#/components/schemas/ApplicationClientOAuth2NativeConfigurationResponse_ApplicationConfig'
        description:
          type: string
        enabled:
          type: boolean
        friendlyLoginPageUrlPart:
          type: string
        id:
          type: string
        loginUrl:
          type: string
        loginUrlShortcut:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - ssp
          - oauth2
          - saml2
          - orgPortal
          - bridge
          - oauth2Simplified
          - oauth2Native
          - tokenExchange
        websiteUrl:
          type: string
    InternalEventHookLogResponse:
      type: object
      properties:
        accountEventId:
          type: string
        accountId:
          type: string
        id:
          type: string
        identityStore:
          type: string
        logSummary:
          $ref: '#/components/schemas/LogSummaryResponse'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/InternalLogResponse'
        timestamp:
          type: string
    Oauth2ClientUpdate_ApplicationConfig:
      required:
      - configuration
      - id
      - name
      - type
      type: object
      properties:
        applicationDomain:
          type: string
        applicationLauncherEntry:
          $ref: '#/components/schemas/ApplicationLauncherEntryRequest_ApplicationConfig'
        baseOrganization:
          $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        configuration:
          $ref: '#/components/schemas/OAuth2Configuration_ApplicationConfig'
        description:
          type: string
        enabled:
          type: boolean
          default: false
        friendlyLoginPageUrlPart:
          maxLength: 16
          minLength: 3
          pattern: ^[-a-zA-Z0-9]*$
          type: string
        id:
          maxLength: 36
          minLength: 1
          type: string
        loginUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
        loginUrlShortcut:
          maxLength: 255
          minLength: 1
          pattern: ^[-a-zA-Z0-9]*$
          type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        type:
          type: string
          description: This field cannot be altered
          enum:
          - ssp
          - oauth2
          - saml2
          - orgPortal
          - bridge
          - oauth2Simplified
          - oauth2Native
          - tokenExchange
        websiteUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
    OrgPortalClientUpdate_ApplicationConfig:
      required:
      - id
      - name
      - type
      type: object
      properties:
        applicationDomain:
          type: string
        applicationLauncherEntry:
          $ref: '#/components/schemas/ApplicationLauncherEntryRequest_ApplicationConfig'
        baseOrganization:
          $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        description:
          type: string
        enabled:
          type: boolean
          default: false
        friendlyLoginPageUrlPart:
          maxLength: 16
          minLength: 3
          pattern: ^[-a-zA-Z0-9]*$
          type: string
        id:
          maxLength: 36
          minLength: 1
          type: string
        loginUrlShortcut:
          maxLength: 255
          minLength: 1
          pattern: ^[-a-zA-Z0-9]*$
          type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        type:
          type: string
          description: This field cannot be altered
          enum:
          - ssp
          - oauth2
          - saml2
          - orgPortal
          - bridge
          - oauth2Simplified
          - oauth2Native
          - tokenExchange
        websiteUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
    AppleAppSiteAssociationResponse_ApplicationConfig:
      type: object
      properties:
        bundleIdentifier:
          type: string
        teamId:
          type: string
    NameAndId_ApplicationConfig:
      type: object
      properties:
        id:
          type: string
          description: ID of the represented entity
        name:
          type: string
          description: Name of the represented entity
          example: Entity name
    BridgeClientUpdate_ApplicationConfig:
      required:
      - configuration
      - id
      - name
      - type
      type: object
      properties:
        applicationDomain:
          type: string
        applicationLauncherEntry:
          $ref: '#/components/schemas/ApplicationLauncherEntryRequest_ApplicationConfig'
        baseOrganization:
          $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        configuration:
          $ref: '#/components/schemas/OAuth2Configuration_ApplicationConfig'
        description:
          type: string
        enabled:
          type: boolean
          default: false
        friendlyLoginPageUrlPart:
          maxLength: 16
          minLength: 3
          pattern: ^[-a-zA-Z0-9]*$
          type: string
        id:
          maxLength: 36
          minLength: 1
          type: string
        loginUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
        loginUrlShortcut:
          maxLength: 255
          minLength: 1
          pattern: ^[-a-zA-Z0-9]*$
          type: string
        name:
          maxLength: 255
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        type:
          type: string
          description: This field cannot be altered
          enum:
          - ssp
          - oauth2
          - saml2
          - orgPortal
          - bridge
          - oauth2Simplified
          - oauth2Native
          - tokenExchange
        websiteUrl:
          maxLength: 1024
          minLength: 1
          pattern: ^$|^\S(.*\S)?$
          type: string
    BaseEventHookLogListResponse:
      type: object
      properties:
        accountEventId:
          type: string
        accountId:
          type: string
        id:
          type: string
        identityStore:
          type: string
        logSummary:
          $ref: '#/components/schemas/LogSummaryResponse'
        timestamp:
          type: string
    BridgeClientResponse_ApplicationConfig:
      type: object
      properties:
        applicationDomain:
          type: string
        applicationLauncherEntry:
          $ref: '#/components/schemas/ApplicationLauncherEntryResponse_ApplicationConfig'
        baseOrganization:
          $ref: '#/components/schemas/IdReferenceResponse_ApplicationConfig'
        configuration:
          $ref: '#/components/schemas/ApplicationClientOAuth2ConfigurationResponse_ApplicationConfig'
        description:
          type: string
        enabled:
          type: boolean
        friendlyLoginPageUrlPart:
          type: string
        id:
          type: string
        loginUrl:
          type: string
        loginUrlShortcut:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - ssp
          - oauth2
          - saml2
          - orgPortal
          - bridge
          - oauth2Simplified
          - oauth2Native
          - tokenExchange
        websiteUrl:
          type: string
    AllowedAuthorizationServersRequest_ApplicationConfig:
      required:
      - actorTokens
      - subjectTokens
      type: object
      properties:
        actorTokens:
          maxItems: 32
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/ActorTokenRequest_ApplicationConfig'
        subjectTokens:
          maxItems: 32
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/SubjectTokenRequest_ApplicationConfig'
    GenericClient_InsertRequest:
      type: object
      oneOf:
      - $ref: '#/components/schemas/Oauth2Client_InsertRequest'
      - $ref: '#/components/schemas/Saml2Client_InsertRequest'
    LogSummaryResponse:
      type: object
      properties:
        error:
          type: integer
          format: int32
        exception:
          type: boolean
        info:
          type: integer
          format: int32
    ApplicationLauncherEntryResponse_ApplicationConfig:
      type: object
      properties:
        displayName:
          type: string
        enabled:
          type: boolean
        logoUrl:
          type: string
    Saml2ClientUpdate_ApplicationConfig:
      required:
      - configuration
      - id
      - name
      - type
      type: object
      properties:
        applicationDomain:
          type: string
        applicationLauncherEntry:
          $ref: '#/components/schemas/ApplicationLauncherEntryRequest_ApplicationConfig'
        baseOrganization:
          $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        configuration:
          $ref: '#/components/schemas/ApplicationClientSaml2ConfigurationUpdateRequest_ApplicationConfig'
        description:
          type: string
        enabled:
          type: boolean
          default: false
        friendlyLoginPageUrlPart:
