openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Bridge Policy API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Bridge Policy
paths:
  /admin/api/v2/applications/{applicationId}/clients/{clientId}/bridgePolicies:
    get:
      description: 'You can list bridge policies by calling this endpoint


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: list_1
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                uniqueItems: true
                type: array
                items:
                  $ref: '#/components/schemas/BridgePolicyResponse_ApplicationConfig'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_application
      summary: List bridge policies
      tags:
      - Bridge Policy
    post:
      description: 'You can create a bridge policy by calling this endpoint


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_application |'
      operationId: create_2
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgePolicyUpsertRequest_ApplicationConfig'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BridgePolicyResponse_ApplicationConfig'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_application
      summary: Create a bridge policy
      tags:
      - Bridge Policy
  /admin/api/v2/applications/{applicationId}/clients/{clientId}/bridgePolicies/{apiAccessPolicyId}:
    delete:
      description: 'You can delete a bridge policy by calling this endpoint


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_application |'
      operationId: delete
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      - in: path
        name: apiAccessPolicyId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_application
      summary: Delete a bridge policy
      tags:
      - Bridge Policy
    get:
      description: 'You can get a bridge policy by calling this endpoint


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_application |'
      operationId: get
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      - in: path
        name: apiAccessPolicyId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BridgePolicyResponse_ApplicationConfig'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_application
      summary: Get a bridge policy
      tags:
      - Bridge Policy
    put:
      description: 'You can update a bridge policy by calling this endpoint


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_application |'
      operationId: update
      parameters:
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      - in: path
        name: apiAccessPolicyId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgePolicyUpsertRequest_ApplicationConfig'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BridgePolicyResponse_ApplicationConfig'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_application
      summary: Update a bridge policy
      tags:
      - Bridge Policy
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    BridgePolicyResponse_ApplicationConfig:
      type: object
      properties:
        apiAccessPolicy:
          $ref: '#/components/schemas/IdReferenceResponse_ApplicationConfig'
        headers:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/BridgePolicyResponse.Header_ApplicationConfig'
        healthMonitoringPath:
          type: string
        upstreamUrlPath:
          type: string
        upstreamUrls:
          uniqueItems: true
          type: array
          items:
            type: string
    BridgePolicyUpsertRequest_ApplicationConfig:
      required:
      - apiAccessPolicy
      - headers
      - upstreamUrls
      type: object
      properties:
        apiAccessPolicy:
          $ref: '#/components/schemas/IdReferenceRequest_ApplicationConfig'
        headers:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/BridgePolicyUpsertRequest.Header_ApplicationConfig'
        healthMonitoringPath:
          maxLength: 1024
          minLength: 0
          type: string
          description: Must start with `/`. Expect a HTTP 200 OK response on this path on the upstream server.
        upstreamUrlPath:
          maxLength: 1024
          minLength: 0
          type: string
          description: Must start with `/` and must not end with `/`.
        upstreamUrls:
          type: array
          items:
            maxLength: 1024
            minLength: 0
            type: string
            description: Must start with `http(s)://` and must not contain path, query or fragment part. An optional port can be specified.
    BridgePolicyUpsertRequest.Header_ApplicationConfig:
      required:
      - idTokenClaim
      - key
      type: object
      properties:
        idTokenClaim:
          type: string
        key:
          type: string
      description: Forwards a value to upstream server from id_token under the specified key
    IdReferenceRequest_ApplicationConfig:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    BridgePolicyResponse.Header_ApplicationConfig:
      type: object
      properties:
        idTokenClaim:
          type: string
        key:
          type: string
      description: Forwards a value to upstream server from id_token under the specified key
    IdReferenceResponse_ApplicationConfig:
      type: object
      properties:
        id:
          type: string
          description: ID of the represented entity
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
