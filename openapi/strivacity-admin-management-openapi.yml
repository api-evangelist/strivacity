      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminAdaptiveAccessPolicyResponse_AdaptiveMFA'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
