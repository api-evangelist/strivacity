components:
  schemas:
    AccountAttributeConnector_AccountAttribute:
      type: object
      properties:
        readFromPath:
          maxLength: 256
          minLength: 1
          type: string
      description: Represents the connector related configurations
    AccountAttribute_AccountAttribute:
      required:
      - displayName
      - frontendHook
      - id
      - name
      - type
      type: object
      properties:
        connector:
          $ref: '#/components/schemas/AccountAttributeConnector_AccountAttribute'
        displayName:
          maxLength: 128
          minLength: 1
          pattern: ^$|^[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°]([\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*° ]*[\p{L}\p{N}\-.:\/_(){}\[\]|&'"?!@+*°])?$
          type: string
        displayOnAdminConsole:
          type: boolean
          default: false
        displayOnMyAccount:
          type: boolean
          default: false
        displayOnOrganizationPortal:
          type: boolean
          default: false
        displayOnRegistration:
          type: boolean
          default: false
        editableOnAdminConsole:
          type: boolean
          default: false
        editableOnMyAccount:
          type: boolean
          default: false
        editableOnOrganizationPortal:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: false
        frontendHook:
          $ref: '#/components/schemas/FrontendHook_AccountAttribute'
        id:
          type: string
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
          type: string
        nativeClaim:
          $ref: '#/components/schemas/NativeClaim_AccountAttribute'
        path:
          maxLength: 128
          minLength: 0
          pattern: ^(?:[a-zA-Z][a-zA-Z0-9_]*(?:\.[a-zA-Z][a-zA-Z0-9_]*)*)?$
          type: string
          description: Default value is an empty string
        required:
          type: boolean
          default: false
        type:
          type: string
          enum:
          - STRING
          - CHECKBOX
          - SELECT
          - PHONE_NUMBER
          - EMAIL
          - DATE
          - PASSWORD
          - USERNAME_IDENTIFIER
          - EMAIL_IDENTIFIER
          - PHONE_IDENTIFIER
          - STRING_LIST
          - SELECT_LIST
          - PHONE_NUMBER_LIST
          - EMAIL_LIST
          - DATE_LIST
          - COMPLEX_LIST
      description: Represents an account attribute
      discriminator:
        propertyName: type
    AccountEventActorClient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      description: Client in which the actor initiated the event
    AccountEventHeaderResponse:
      type: object
      properties:
        actor:
          $ref: '#/components/schemas/EventActor'
        actorApplication:
          $ref: '#/components/schemas/ActorApplication'
        actorClient:
          $ref: '#/components/schemas/AccountEventActorClient'
        endTimestamp:
          type: string
          format: date-time
        eventId:
          type: string
          format: uuid
        labels:
          type: array
          description: 'Labels indicating what happened during the occurrence of the event.Labels are in the following format: `(failure|success):{eventType}`'
          items:
            type: string
            example: success:login
        loginSessionId:
          type: string
        startTimestamp:
          type: string
          format: date-time
        subject:
          $ref: '#/components/schemas/Subject'
        type:
          type: string
          description: 'Gives additional context for an account event. An example for each event type: `customerFlow` - an account tries to log in, `selfService` - an account modifies their own metadata,
            `administrative` - an admin modifies metadata for an account'
          enum:
          - customerFlow
          - selfService
          - administrative
          - scheduled
          - bulkOperation
          - systemInitiatedOperation
        variantId:
          type: string
      description: Represents an account event header. Fields with empty values are not included in the response.
    AccountEventResponse:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionResponse'
        actor:
          $ref: '#/components/schemas/EventActor'
        actorApplication:
          $ref: '#/components/schemas/ActorApplication'
        actorClient:
          $ref: '#/components/schemas/AccountEventActorClient'
        endTimestamp:
          type: string
          format: date-time
        eventId:
          type: string
          format: uuid
        labels:
          type: array
          description: 'Labels indicating what happened during the occurrence of the event.Labels are in the following format: `(failure|success):{eventType}`'
          items:
            type: string
            example: success:login
        loginSessionId:
          type: string
        startTimestamp:
          type: string
          format: date-time
        subject:
          $ref: '#/components/schemas/Subject'
        type:
          type: string
          description: 'Gives additional context for an account event. An example for each event type: `customerFlow` - an account tries to log in, `selfService` - an account modifies their own metadata,
            `administrative` - an admin modifies metadata for an account'
          enum:
          - customerFlow
          - selfService
          - administrative
          - scheduled
          - bulkOperation
          - systemInitiatedOperation
        variantId:
          type: string
      description: Represents an account event. Fields with empty values are not included in the response.
    AccountIdentifierUpdateRequest_Account:
      required:
      - type
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
          description: Identifier method used by identity stores
          enum:
          - username
          - email
          - phone
    AccountInsertRequest.Email_Account:
      type: object
      properties:
        id:
          type: string
          description: Represents the email identifier
          example: john@example.com
        verified:
          type: boolean
          default: false
    AccountLock_Account:
      type: object
      properties:
        until:
          type: string
          description: null in case of permanent lock, otherwise temporary lock
          format: date-time
      description: Represents a lock on the account
    AccountLockoutResponse_AdaptiveMFA:
      type: object
      properties:
        passcode:
          $ref: '#/components/schemas/LockoutResponse_AdaptiveMFA'
        password:
          $ref: '#/components/schemas/LockoutResponse_AdaptiveMFA'
      description: Represents account lockout object.
    AccountLockout_Account:
      type: object
      properties:
        failedPasscodeAttemptCount:
          type: integer
          format: int32
        failedPasscodeAttemptCountPermanentLock:
          type: integer
          format: int32
        failedPasswordAttemptCount:
          type: integer
          format: int32
        failedPasswordAttemptCountPermanentLock:
          type: integer
          format: int32
        locks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AccountLock_Account'
      description: Represents the account lockout details
    AccountLockout_AdaptiveMFA:
      required:
      - passcode
      - password
      type: object
      properties:
        passcode:
          $ref: '#/components/schemas/Lockout_AdaptiveMFA'
        password:
