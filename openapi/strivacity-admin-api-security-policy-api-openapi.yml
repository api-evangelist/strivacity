openapi: 3.2.0
info:
  description: API documentation of Admin Portal - Admin Management
  title: Admin Portal - Admin Management Admin API Security Policy…
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Admin API Security Policy
paths:
  /admin/api/v1/admin/accessPolicy:
    get:
      description: 'You can get the admin API security policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_admin_api_access |'
      operationId: getAdminApiAccessPolicy
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiSecurityPolicyResponse_ApiAccessPolicy'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_admin_api_access
      summary: Get admin API security policy
      tags:
      - Admin API Security Policy
  /admin/api/v1/admin/accessPolicy/assignments:
    post:
      description: 'You can create a client assignment for the admin API security policy by calling this endpoint. A client can only have one assignment.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_admin_api_access |'
      operationId: createApplicationAssignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSecurityPolicyAssignmentUpsertRequest_ApiAccessPolicy'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiSecurityPolicyAssignmentResponse_ApiAccessPolicy'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:config_admin_api_access
      summary: Create a client assignment
      tags:
      - Admin API Security Policy
  /admin/api/v1/admin/accessPolicy/assignments/{clientId}:
    delete:
      description: 'You can delete a client assignment from the admin API security policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | delete:config_admin_api_access |'
      operationId: deleteAdminApplicationAssignmentFromApiAccessPolicy
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - delete:config_admin_api_access
      summary: Delete a client assignment
      tags:
      - Admin API Security Policy
    get:
      description: 'You can get a client assignment to the admin API security policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_admin_api_access |'
      operationId: getAdminApiAccessPolicyByClientId
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminApiSecurityPolicyAssignmentResponse_ApiAccessPolicy'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_admin_api_access
      summary: Get a client assignment
      tags:
      - Admin API Security Policy
    put:
      description: 'You can update a client assignment for the admin API security policy by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_admin_api_access |'
      operationId: updateApplicationAssignment
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSecurityPolicyAssignmentUpsertRequest_ApiAccessPolicy'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiSecurityPolicyAssignmentResponse_ApiAccessPolicy'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_admin_api_access
      summary: Update a client assignment
      tags:
      - Admin API Security Policy
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    ApiSecurityPolicyAssignmentResponse_ApiAccessPolicy:
      type: object
      properties:
        apiAccessPolicy:
          $ref: '#/components/schemas/IdReferenceResponse_ApiAccessPolicy'
        application:
          $ref: '#/components/schemas/NameAndId_ApiAccessPolicy'
        client:
          $ref: '#/components/schemas/NameAndId_ApiAccessPolicy'
        scopes:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ScopeResponse_ApiAccessPolicy'
    IdReferenceRequest_ApiAccessPolicy:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    ApiSecurityPolicyResponse_ApiAccessPolicy:
      type: object
      properties:
        assignments:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ApiSecurityPolicyAssignmentResponse_ApiAccessPolicy'
        audience:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        policyTag:
          type: string
        scopes:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ScopeResponse_ApiAccessPolicy'
    NameAndId_ApiAccessPolicy:
      type: object
      properties:
        id:
          type: string
          description: ID of the represented entity
    AdminApiSecurityPolicyAssignmentResponse_ApiAccessPolicy:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/NameAndId_ApiAccessPolicy'
        client:
          $ref: '#/components/schemas/NameAndId_ApiAccessPolicy'
        scopes:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ScopeResponse_ApiAccessPolicy'
    ApiSecurityPolicyAssignmentUpsertRequest_ApiAccessPolicy:
      required:
      - apiAccessPolicy
      - client
      - scopes
      type: object
      properties:
        apiAccessPolicy:
          $ref: '#/components/schemas/IdReferenceRequest_ApiAccessPolicy'
        client:
          $ref: '#/components/schemas/IdReferenceRequest_ApiAccessPolicy'
        scopes:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/IdReferenceRequest_ApiAccessPolicy'
    IdReferenceResponse_ApiAccessPolicy:
      type: object
      properties:
        id:
          type: string
          description: ID of the represented entity
    ScopeResponse_ApiAccessPolicy:
      type: object
      properties:
        displayName:
          type: string
        id:
          type: string
        name:
          type: string
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
