openapi: 3.2.0
info:
  description: API documentation of Admin Portal - Admin Management
  title: Admin Portal - Admin Management Admin Account API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Admin Account
paths:
  /admin/api/v1/admin/identityStore/accounts:
    get:
      description: 'You can list the existing admin accounts by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:admin_account |'
      operationId: listAccounts
      parameters:
      - description: Account ID
        in: query
        name: id
        schema:
          type: string
      - description: Login identifier (username, email or phone). Start with `@` to search by email domain. When searching by domain, only email addresses belonging to that domain or its subdomains are returned.
        in: query
        name: loginIdentifier
        schema:
          type: string
      - description: Attribute mapped to the Email native claim. Start with `@` to search by domain. When searching by domain, only email addresses belonging to that domain or its subdomains are returned.
        in: query
        name: emailNativeClaim
        schema:
          type: string
      - description: User name in account info
        in: query
        name: userNameNativeClaim
        schema:
          type: string
      - description: Account is enabled or not
        in: query
        name: enabled
        schema:
          type: boolean
      - description: Start date used for filtering based on updatedAt field. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: updatedAtStartDate
        schema:
          type: string
          format: date-time
      - description: End date used for filtering based on updatedAt field. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: updatedAtEndDate
        schema:
          type: string
          format: date-time
      - description: Start date used for filtering based on createdAt field. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: createdAtStartDate
        schema:
          type: string
          format: date-time
      - description: End date used for filtering based on createdAt field. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: createdAtEndDate
        schema:
          type: string
          format: date-time
      - description: Start date used for filtering based on disabledAt field. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: disabledAtStartDate
        schema:
          type: string
          format: date-time
      - description: End date used for filtering based on disabledAt field. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: disabledAtEndDate
        schema:
          type: string
          format: date-time
      - description: Start date used for filtering based on lastLoggedIn field. Must not be provided if `neverLoggedIn` is true. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: lastLoginAtStartDate
        schema:
          type: string
          format: date-time
      - description: End date used for filtering based on lastLoggedIn field. Must not be provided if `neverLoggedIn` is true. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: lastLoginAtEndDate
        schema:
          type: string
          format: date-time
      - description: Flag to filter for accounts that have never logged in.
        in: query
        name: neverLoggedIn
        schema:
          type: boolean
      - description: Start date used for filtering based on lastAuthenticationActivity field. Must not be provided if `neverLoggedIn` is true. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: lastAuthenticationActivityAtStartDate
        schema:
          type: string
          format: date-time
      - description: End date used for filtering based on lastAuthenticationActivity field. Must not be provided if `neverLoggedIn` is true. Accepted formats are an ISO 8061 timestamp or an ISO 8061 duration with a +/- prefix.
        in: query
        name: lastAuthenticationActivityAtEndDate
        schema:
          type: string
          format: date-time
      - content:
          '*/*':
            schema:
              type: array
              items:
                type: string
        description: Role IDs used for filtering
        in: query
        name: roles
      - description: Type of inclusion used for roles filter. By setting to `exclude` makes it an `AND` relationship within the values of the roles parameter.
        in: query
        name: rolesFilter
        schema:
          type: string
          enum:
          - include
          - exclude
      - description: Zero-based page index (0..N)
        in: query
        name: page
        schema:
          type: integer
          format: int64
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        schema:
          type: integer
          format: int64
          default: 20
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse_Account'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:admin_account
      summary: List admin accounts
      tags:
      - Admin Account
    post:
      description: 'You can create an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: createAccount
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountInsertRequest_Account'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountResponse_Account'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:admin_account
      summary: Create an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}:
    delete:
      description: 'You can delete an admin account by calling this endpoint. Admin accounts cannot delete themselves. The last existing admin account cannot be deleted.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | delete:admin_account |'
      operationId: deleteAccountById
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Administrator accounts cannot delete themselves
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: The last assigned admin cannot be deleted
      security:
      - securityScheme:
        - delete:admin_account
      summary: Delete an admin account
      tags:
      - Admin Account
    get:
      description: 'You can get an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:admin_account |'
      operationId: getAccountById
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountResponse_Account'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:admin_account
      summary: Get an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/authenticators:
    post:
      description: 'You can create an authenticator for an admin account by calling this endpoint. Authenticator type can be either `email` or `phone`.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account_authenticator |'
      operationId: addAuthenticator
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorAdminInsertRequest_Account'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthenticatorResponse_Account'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:admin_account_authenticator
      summary: Create authenticator for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/authenticators/{authenticatorId}:
    delete:
      description: 'You can delete an authenticator for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | delete:admin_account_authenticator |'
      operationId: deleteAuthenticator
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      - in: path
        name: authenticatorId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - delete:admin_account_authenticator
      summary: Delete authenticator for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/disable:
    post:
      description: 'You can disable an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: disableAccount
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Disable an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/download:
    get:
      description: 'You can download the admin account information in HTML or JSON format by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:admin_account_download |'
      operationId: getPersonalData
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      - in: query
        name: fileType
        required: true
        schema:
          pattern: html|json
          type: string
          enum:
          - html
          - json
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="{filename}"
              style: simple
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Invalid file type or file type is not present
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:admin_account_download
      summary: Download admin account information
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/enable:
    post:
      description: 'You can enable an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: enableAccount
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Enable an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/identities:
    get:
      description: 'You can list the existing identities for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:admin_account_identity |'
      operationId: getIdentities
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdentitiesResponse_Identities'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:admin_account_identity
      summary: List identities for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/identities/identifier:
    post:
      description: 'You can update the identifier for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account_identity |'
      operationId: updateAccountIdentifier
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountIdentifierUpdateRequest_Account'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdentitiesResponse_Account'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
        '409':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Conflict
      security:
      - securityScheme:
        - write:admin_account_identity
      summary: Update identifier for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/liftPasscodeLock:
    post:
      description: 'You can lift passcode lock for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: liftPasscodeLock
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Lift passcode lock for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/liftPasswordLock:
    post:
      description: 'You can lift password lock for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: liftPasswordLock
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Lift password lock for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/notificationPreferences:
    put:
      description: 'You can update the notification preferences for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: updateAdminAccountNotificationPreferences
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
