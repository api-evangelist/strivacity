      security:
      - securityScheme:
        - write:admin_account_authenticator
      summary: Request password reset for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/personal:
    put:
      description: 'You can update metadata for an admin account by calling this endpoint. Only the given attributes will be modified. After a successful update, the entire metadata will be returned. Attributes provided with an explicit `null` value won''t be overridden by external metadata values.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: updateLocalMetadata
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Update metadata for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/roles:
    post:
      description: 'You can assign one or more roles to an account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: addRolesToAccount
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IdReferenceRequest_Account'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Assign multiple roles to an account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/sessions:
    delete:
      description: 'You can clear the sessions for an admin account by calling this endpoint. Note that clearing sessions for an admin account results in logging out of all browsers that admin had been logged into previously. This performs a back-channel logout on the specified admin account.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: clearAccountDeviceSessions
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Clear sessions for an admin account
      tags:
      - Admin Account
    get:
      description: 'You can list the sessions for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:admin_account |'
      operationId: getIdentifiedAccountDeviceSessions
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentifiedSessionResponse_Account'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:admin_account
      summary: List sessions for an admin account
      tags:
      - Admin Account
  /admin/api/v1/admin/identityStore/accounts/{accountId}/sessions/{sessionId}:
    delete:
      description: 'You can delete a session for an admin account by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account |'
      operationId: deleteAccountDeviceSession
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:admin_account
      summary: Delete session for an admin account
      tags:
      - Admin Account
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    NotificationPreferencesResponse:
      type: object
      properties:
        accountAttributeUpdate:
          type: boolean
        accountDeletion:
          type: boolean
        accountLockout:
          type: boolean
        mfaMethodChange:
          type: boolean
        passwordResetSuccess:
          type: boolean
      description: Contains which types of notifications are enabled or not for an account
    AccountProofingWithNameAndDeletedResponse_Account:
      type: object
      properties:
        attempts:
          type: integer
          format: int64
        deleted:
          type: boolean
        id:
          type: string
          format: uuid
        invalidatedAt:
          type: string
          format: date-time
        policyId:
          type: string
        proofedAt:
          type: string
          format: date-time
    AccountRole_Account:
      required:
      - id
      - organization
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: ID of the represented role
        organization:
          minLength: 1
          type: string
          description: ID of the represented organization
      description: Represents an organization-role assignment
    AdminAccountInsertLocal_Account:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: object
            description: Represents metadata for account information
            example: "{\n  \"name\": {\n    \"givenName\": \"John\"\n    \"familyName\": \"Doe\"\n  }\n}"
          description: Represents metadata for account information
          example: "{\n  \"name\": {\n    \"givenName\": \"John\"\n    \"familyName\": \"Doe\"\n  }\n}"
    IdentitiesResponse.External_Account:
      type: object
      properties:
        display:
          type: string
        id:
          type: string
          description: Represents an external identifier
        metadata:
          type: object
          additionalProperties:
            type: object
    AdminPasswordResetDTO_Account:
      type: object
      properties:
        newPassword:
          maxLength: 256
          minLength: 1
          type: string
        skipPasswordPolicy:
          type: boolean
    IdReferenceRequest_Account:
      required:
      - id
      type: object
      properties:
        id:
          pattern: ^[a-zA-Z0-9-]{1,36}$
          type: string
          description: ID of the represented entity
    AdminAccountInsertRequest_Account:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/AccountInsertRequest.Email_Account'
        local:
          $ref: '#/components/schemas/AdminAccountInsertLocal_Account'
        password:
          maxLength: 256
          minLength: 1
          type: string
        skipPasswordPolicy:
          type: boolean
          default: false
    AccountIdentifierUpdateRequest_Account:
      required:
      - type
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
