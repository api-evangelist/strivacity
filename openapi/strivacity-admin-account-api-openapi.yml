  /admin/api/v1/admin/identityStore/accounts/{accountId}/password/reset:
    post:
      description: 'You can request a password reset for an admin account by calling this endpoint. A password reset email will be sent to the email address of the corresponding admin account.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:admin_account_authenticator |'
      operationId: adminInitiatedForgottenPassword
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
