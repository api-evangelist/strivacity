openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Lifecycle Event Hook Tryout API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Lifecycle Event Hook Tryout
paths:
  /admin/api/v1/eventHooks/function/{functionId}/test:
    post:
      description: 'You can create a tryout function resource by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_event_hook |'
      operationId: createFunctionResource
      parameters:
      - in: path
        name: functionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TryOutEventHookRequest_EventHookFunction'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TryOutEventHookIdResponse_EventHookFunction'
          description: Created
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_event_hook
      summary: Create a tryout function resource
      tags:
      - Lifecycle Event Hook Tryout
  /admin/api/v1/eventHooks/function/{functionId}/test/{id}:
    delete:
      description: 'You can delete a tryout function resource by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | delete:config_event_hook |'
      operationId: deleteFunctionResource
      parameters:
      - in: path
        name: functionId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - delete:config_event_hook
      summary: Delete a tryout function resource
      tags:
      - Lifecycle Event Hook Tryout
  /admin/api/v1/eventHooks/function/{functionId}/test/{id}/call:
    post:
      description: 'You can call a tryout function resource by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | write:config_event_hook |'
      operationId: callFunctionResource
      parameters:
      - in: path
        name: functionId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallTryOutEventHookRequest_EventHookFunction'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FunctionCallResponse_EventHookFunction'
          description: OK
        '400':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - write:config_event_hook
      summary: Call a tryout function resource
      tags:
      - Lifecycle Event Hook Tryout
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    TryOutEventHookRequest_EventHookFunction:
      required:
      - code
      type: object
      properties:
        code:
          maxLength: 256000
          minLength: 1
          type: string
          description: JavaScript code to be executed for the event hook function
        packageDependencies:
          type: object
          additionalProperties:
            type: string
            description: Dependencies used for the event hook function
          description: Dependencies used for the event hook function
    TryOutEventHookIdResponse_EventHookFunction:
      type: object
      properties:
        id:
          type: string
          format: uuid
    FunctionCallResponse_EventHookFunction:
      type: object
      properties:
        body:
          type: object
        status:
          type: integer
          format: int32
    CallTryOutEventHookRequest_EventHookFunction:
      required:
      - code
      - requestBody
      type: object
      properties:
        code:
          maxLength: 256000
          minLength: 1
          type: string
          description: JavaScript code to be executed for the event hook function
        packageDependencies:
          type: object
          additionalProperties:
            type: string
            description: Dependencies used for the event hook function
          description: Dependencies used for the event hook function
        requestBody:
          type: object
          description: Request body for the tryout function
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
