openapi: 3.2.0
info:
  description: API documentation of Admin Portal
  title: Admin Portal Plugin Library API
  version: v0.0.1
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: example.strivacity.com
      description: Your Strivacity tenant
tags:
- name: Plugin Library
paths:
  /admin/api/v2/pluginLibrary/categories:
    get:
      description: 'You can get the available categories by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_event_hook |

        | read:config_journey |'
      operationId: getCategories
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_event_hook
        - read:config_journey
      summary: Get categories for plugin library
      tags:
      - Plugin Library
  /admin/api/v2/pluginLibrary/eventHookSnippets/{type}:
    get:
      description: 'You can get snippets for a specific hook type by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_event_hook |'
      operationId: getSnippets
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventHookSnippet'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_event_hook
      summary: Get snippets by hook type
      tags:
      - Plugin Library
  /admin/api/v2/pluginLibrary/eventHookSnippets/{type}/{id}:
    get:
      description: 'You can get snippet code by defining the hook type and snippet ID.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_event_hook |'
      operationId: getSnippetCode
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventHookSnippetCode'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_event_hook
      summary: Get snippet code
      tags:
      - Plugin Library
  /admin/api/v2/pluginLibrary/eventHooks:
    get:
      description: 'You can get the integrations for lifecycle event hooks by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_event_hook |'
      operationId: getEventHooks
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/EventHookIntegrationListResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_event_hook
      summary: Get plugin library for lifecycle event hooks
      tags:
      - Plugin Library
  /admin/api/v2/pluginLibrary/eventHooks/{id}:
    get:
      description: 'You can get an integration by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_event_hook |'
      operationId: getEventHookIntegration
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventHookIntegrationResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_event_hook
      summary: Get an integration for lifecycle event hook
      tags:
      - Plugin Library
  /admin/api/v2/pluginLibrary/journeys:
    get:
      description: 'You can get the integrations for journeys by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_journey |'
      operationId: getJourneys
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/JourneyIntegrationListResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
      security:
      - securityScheme:
        - read:config_journey
      summary: Get plugin library for journeys
      tags:
      - Plugin Library
  /admin/api/v2/pluginLibrary/journeys/{id}:
    get:
      description: 'You can get an integration by calling this endpoint.


        | REQUIRED API PERMISSION |

        |:------------------------|

        | read:config_journey |'
      operationId: getJourneyIntegration
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JourneyIntegrationResponse'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Forbidden
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProblemJson'
          description: Not Found
      security:
      - securityScheme:
        - read:config_journey
      summary: Get an integration for journey
      tags:
      - Plugin Library
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        detail:
          type: string
        entityName:
          type: string
          description: The name of the entity within the error has occurred
        errorKey:
          type: string
          description: A unique identifier of the error
        fieldErrors:
          type: array
          description: Field constraint violation errors
          items:
            $ref: '#/components/schemas/FieldError'
        message:
          type: string
          description: A unique identifier in format of 'error.{errorKey}'
        params:
          type: array
          description: Further information related to the actual error
          items:
            type: object
            additionalProperties:
              type: object
        path:
          type: string
          description: Request URI
        status:
          type: integer
          description: Status code
          format: int32
        title:
          type: string
      description: Based on [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807)
    EventHookSnippet:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
      description: Represents a snippet for an event hook
    JourneyIntegrationListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        description:
          type: string
        displayName:
          type: string
        logoUrl:
          type: string
        maintainer:
          type: string
        summary:
          type: string
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        objectName:
          type: string
    CategoryResponse:
      type: object
      properties:
        displayName:
          type: string
        name:
          type: string
    Journey:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    EventHookIntegrationResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        description:
          type: string
        displayName:
          type: string
        hooks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LifecycleEventHook'
        logoUrl:
          type: string
        maintainer:
          type: string
        summary:
          type: string
    JourneyIntegrationResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        description:
          type: string
        displayName:
          type: string
        journeys:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Journey'
        logoUrl:
          type: string
        maintainer:
          type: string
        summary:
          type: string
    EventHookIntegrationListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        description:
          type: string
        displayName:
          type: string
        logoUrl:
          type: string
        maintainer:
          type: string
        summary:
          type: string
    EventHookSnippetCode:
      type: object
      properties:
        code:
          type: string
        packageDependencies:
          type: object
          additionalProperties:
            type: string
      description: Represents the code of the snippet
    LifecycleEventHook:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        packageDependencies:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    securityScheme:
      scheme: bearer
      type: http
