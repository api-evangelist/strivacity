note: >-
  Derived from the URL hierarchy and the id-reference fields in the published schemas. Strivacity's model
  is strongly hierarchical: almost every customer-facing entity is reached through an Identity Store, and
  almost every configuration entity is reached through an Application. There is no id-prefix convention
  (no acct_ / app_ style prefixes) — identifiers are opaque and the entity type is carried by the path,
  not the value.
root_scoping:
  instance: >-
    One dedicated Strivacity instance per brand. Instance-level configuration lives under
    /admin/api/v1/instance and is not further scoped.
  identity_store: >-
    The container for customer accounts. Most account-plane paths are
    /admin/api/v1/identityStores/{identityStoreName}/... — the identity store name, not an id, is the
    path segment.
  application: >-
    The container for clients, journeys, policies and branding. Most configuration paths are
    /admin/api/v1/applications/{applicationId}/... with some at v2.
  admin_plane: >-
    The Admin Management API mirrors much of the account plane for ADMIN accounts, under
    /admin/api/v1/admin/... — a parallel identity store for brand administrators.
