finding: >-
  Strivacity ships NO MCP server of its own. This is a deliberate product position, not an omission, and
  it is worth stating precisely because Strivacity's marketing is heavily agentic and could easily be
  misread as "they have an MCP server."
  Strivacity's role in MCP is the OTHER side of the connection: it is the OAuth 2.1 AUTHORIZATION SERVER
  in front of the CUSTOMER'S MCP server. The customer registers their MCP server as a Protected Resource
  with a canonical resource URL and a scope catalogue; an AI agent is registered (or self-registers via a
  Client ID Metadata Document) as an OAuth2/OIDC client with the AI agent subtype; Strivacity
  authenticates the end customer, shows a plain-language consent screen, and mints an audience-restricted
  token naming that resource. Strivacity implements the authorization portions of the MCP specification;
  the MCP server itself is the customer's to run.
