what_strivacity_provides_to_mcp:
  role: authorization server
  spec: Model Context Protocol authorization
  discovery: >-
    OIDC Discovery at https://{tenant}.strivacity.com/.well-known/openid-configuration. RFC 8414
    oauth-authorization-server is deliberately not served; MCP clients are expected to fall back.
  resource_parameter: RFC 8707, required on both authorization and token requests, matched exactly
  token_audience: the registered canonical resource URL of the MCP server
  token_format: JWT selectable per client so the MCP server can validate locally against the published JWKS
  step_up: >-
    Scope challenges — the MCP server answers 403 with
    WWW-Authenticate: Bearer error="insufficient_scope", scope="..." and Strivacity re-runs consent for
    the additional scopes.
  discovery_challenge: >-
    The MCP server answers 401 with
    WWW-Authenticate: Bearer resource_metadata="https://.../.well-known/oauth-protected-resource/mcp"
  dynamic_clients: >-
    With Client ID Metadata Documents enabled, discovery advertises
    client_id_metadata_document_supported: true so external agents can self-identify without
    pre-registration.
  consent: >-
    Per-scope authorization consent captured from the end customer at login, revocable by them in the
    My Account portal, and recorded in account events with the agent's client id as the actor.
