note: >-
  Strivacity publishes no test-key / live-key split and no fixture or test-data catalogue — every
  instance is a dedicated single-tenant deployment, and the documented pattern is a low (development)
  environment alongside a high (production) environment, both provisioned per brand. What it does
  publish is a free trial instance and a public, unauthenticated protocol sandbox suite (Decoder Ring)
  that Strivacity builds and gives away.
