aid: strivacity
name: Strivacity
description: >-
  Strivacity is a customer identity and access management (CIAM) vendor that runs a single-tenant,
  dedicated-cloud identity platform for consumer, partner, B2B and — since its Agentic AI release —
  AI-agent identities. The product covers registration and self-service, adaptive multi-factor
  authentication, passkeys and FIDO2, social and enterprise federation, consent management, identity
  verification, fraud detection, delegated administration and identity orchestration, and it exposes
  all of it through published REST APIs: an Admin API for configuring and operating an instance, an
  Admin Management API for the admin plane itself, a MyAccount API for end-customer self-service, a
  Journey Flow (Native Journey) API for rendering login and registration natively, and a Simple
  Authentication API. Strivacity also acts as the OAuth 2.1 authorization server in front of a
  customer's own MCP servers and APIs, issuing audience-restricted, consent-gated tokens to AI agents.
url: https://raw.githubusercontent.com/api-evangelist/strivacity/refs/heads/main/apis.yml
