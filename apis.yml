apis:
- name: Strivacity Admin API
  description: >-
    The administrative REST API for a Strivacity instance — accounts and identity stores, applications
    and clients, adaptive access and MFA policies, journeys, branding, consents, claims and dialects,
    groups and roles, organizations, notification and password policies, identity verification, lifecycle
    event hooks, outbound provisioning, event streaming, bulk operations, translations, audit entries and
    account events. 322 operations across 63 tag groups. Authorized with an OAuth 2.0 client-credentials
    bearer token scoped by an API Access policy.
  humanURL: https://docs.strivacity.com/reference/getting-started-with-the-admin-api
  baseURL: https://{tenant}.strivacity.com/admin/api/v1
  tags:
  - Identity
  - CIAM
  - Administration
  - Authentication
  - Authorization
  properties:
  - type: OpenAPI
    url: openapi/strivacity-admin-portal-openapi.yml
  - type: OpenAPI
    url: openapi/strivacity-admin-management-openapi.yml
  - type: OpenAPI
    url: openapi/strivacity-admin-console-getting-started-openapi.yml
  - type: Documentation
    url: https://docs.strivacity.com/docs/apis-and-sdks
  - type: APIReference
    url: https://docs.strivacity.com/reference/getting-started-with-the-admin-api
  - type: GettingStarted
    url: https://docs.strivacity.com/reference/getting-started-1
  - type: Overlay
    url: overlays/strivacity-admin-portal-overlay.yaml
  - type: Overlay
    url: overlays/strivacity-admin-management-overlay.yaml
- name: Strivacity MyAccount API
  description: >-
    The end-customer self-service REST API behind the Strivacity My Account portal — authenticator
    (MFA) management, consent opt-in and opt-out, personal-data export and account deletion, and
    self-management of profile attributes. 18 operations, bearer-token authorized on the customer's
    own session.
  humanURL: https://docs.strivacity.com/reference/getting-started-1
  baseURL: https://{tenant}.strivacity.com/myaccount/api/v1
  tags:
  - Identity
  - Self Service
  - Consent Management
  properties:
  - type: OpenAPI
    url: openapi/strivacity-myaccount-portal-openapi.yml
  - type: APIReference
    url: https://docs.strivacity.com/reference/getting-started-1
  - type: Overlay
    url: overlays/strivacity-myaccount-portal-overlay.yaml
- name: Strivacity Journey Flow API
  description: >-
    The Native Journey (Journey Flow) API used by native and single-page applications to render
    Strivacity login, registration, MFA, passkey, password-reset and account-activation journeys in
    their own UI instead of redirecting to hosted no-code components, plus the Simple Authentication
    API for identifier-and-password authentication.
  humanURL: https://docs.strivacity.com/docs/oidc-client-using-the-journey-flow-api
  baseURL: https://{tenant}.strivacity.com/flow/api
  tags:
  - Identity
  - Authentication
  - Journeys
  properties:
  - type: OpenAPI
    url: openapi/strivacity-native-journey-openapi.yml
  - type: OpenAPI
    url: openapi/strivacity-simple-authentication-openapi.yml
  - type: Documentation
    url: https://docs.strivacity.com/docs/oidc-client-using-the-journey-flow-api
  - type: Overlay
    url: overlays/strivacity-native-journey-overlay.yaml
  - type: Overlay
    url: overlays/strivacity-simple-authentication-overlay.yaml
