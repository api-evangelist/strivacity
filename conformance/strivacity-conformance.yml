domain_standards:
  market: customer identity and access management (CIAM) / identity provider
  note: >-
    The identity market's domain standards ARE the protocol standards, and Strivacity implements them as
    product: OIDC, OAuth 2.0/2.1, SAML 2.0, FIDO2/WebAuthn, plus the newer agent-delegation set (RFC 8707
    resource indicators, token exchange, CIBA, DPoP, PAR, RAR). The one recognised CIAM domain standard
    it does NOT speak is SCIM 2.0 — which for an identity vendor is the standard a buyer with an existing
    IGA or HR-driven provisioning stack will ask about first.
