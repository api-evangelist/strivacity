  evidence: >-
    The ProblemJson schema documents itself as "Based on RFC 7807" and is served as
    application/problem+json on 834 of 1,460 error responses across the published specs. Flavored — it
    omits the `type` member and adds errorKey/entityName/fieldErrors.
- id: rfc9457-problem-details
