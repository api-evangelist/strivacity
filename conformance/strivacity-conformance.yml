- id: rfc8707-resource-indicators
  conforms: true
  evidence: >-
    The `resource` parameter is required on both the authorization and token request for protected
    resources; Strivacity matches it exactly and makes it the token audience.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: partial
  evidence: >-
    Strivacity requires the customer's own MCP/resource server to publish RFC 9728 metadata naming the
    Strivacity issuer, and documents the 401 WWW-Authenticate resource_metadata challenge. Strivacity
    does not itself serve a protected-resource metadata document.
- id: rfc9700-oauth-security-bcp
